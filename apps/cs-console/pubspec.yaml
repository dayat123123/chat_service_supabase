name: cs_console
description: Web CS khusus untuk CS dan supervisor OLT (Flutter web, hanya lewat VPN di produksi).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.2.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  olt_social:
    path: ../../packages/olt_social
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/sounds/
