name: cs-console-react

on:
  push:
    branches: [main]
    paths:
      - apps/cs-console-react/**
      - docker/**
      - .github/workflows/cs-console-react.yml
  pull_request:
    paths:
      - apps/cs-console-react/**
      - docker/**
      - .github/workflows/cs-console-react.yml

permissions:
  contents: read

concurrency:
  group: cs-console-react-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cs-console-react

jobs:
  verify:
    name: Lint, typecheck, unit, build, ukuran, lisensi
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/cs-console-react/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size:check
      - run: npm run license:check

  image:
    name: Image nginx + Trivy
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t olt-social/cs-console:${{ github.sha }} .
      - name: Trivy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: olt-social/cs-console:${{ github.sha }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy dependensi, secret, konfigurasi
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/cs-console-react
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  e2e:
    name: E2E Playwright vs stack dev
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/cs-console-react/package-lock.json
      - name: Secret dev sekali pakai
        working-directory: .
        run: make gen-secrets
      - name: Stack dev + OLT dummy + web CS
        working-directory: .
        run: make up DUMMY_OLT=1
      - name: Akun staf dev dengan TOTP
        working-directory: .
        run: make cs-staff
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8085
      - name: Laporan Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/cs-console-react/playwright-report
            apps/cs-console-react/test-results
          retention-days: 7
