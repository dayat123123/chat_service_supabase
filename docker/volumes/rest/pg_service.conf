# PostgREST libpq options. A hung PgBouncer connection (network cut without RST) is dropped
# within about 8 s, so PostgREST /ready turns 503 and the Docker healthcheck marks rest unhealthy.
[rest]
connect_timeout=5
keepalives=1
keepalives_idle=5
keepalives_interval=2
keepalives_count=3
tcp_user_timeout=8000
