# Opsi libpq PostgREST (PGSERVICEFILE/PGSERVICE di compose.yml). Koneksi ke PgBouncer yang
# menggantung (network putus tanpa RST) diputus dalam +-8 detik, sehingga /ready PostgREST
# menjadi 503 dan healthcheck Docker menandai rest unhealthy (T9, docs/testing/report-2026-11-03.md).
[rest]
connect_timeout=5
keepalives=1
keepalives_idle=5
keepalives_interval=2
keepalives_count=3
tcp_user_timeout=8000
