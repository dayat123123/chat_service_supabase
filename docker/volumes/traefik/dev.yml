# Dev routers: plain HTTP on the `web` entrypoint. Everything goes to Kong, including Studio
# (Kong basic-auth) and /auth/v1.
http:
  routers:
    realtime:
      entryPoints: [web]
      rule: PathPrefix(`/realtime/v1`)
      service: kong
      middlewares: [ws-limit, rate-limit, security-headers]
      priority: 100

    storage-upload:
      entryPoints: [web]
      rule: PathPrefix(`/storage/v1`) && (Method(`POST`) || Method(`PUT`))
      service: kong
      middlewares: [rate-limit, body-upload, security-headers]
      priority: 95

    media-upload:
      entryPoints: [web]
      rule: PathPrefix(`/media/v1`)
      service: kong
      middlewares: [rate-limit, body-upload, security-headers]
      priority: 95

    integration:
      entryPoints: [web]
      rule: PathPrefix(`/integration/v1`)
      service: kong
      middlewares: [rate-limit, body-integration, security-headers]
      priority: 85

    storage:
      entryPoints: [web]
      rule: PathPrefix(`/storage/v1`)
      service: kong
      middlewares: [rate-limit, security-headers]
      priority: 90

    api:
      entryPoints: [web]
      rule: PathPrefix(`/rest/v1`) || PathPrefix(`/functions/v1`) || PathPrefix(`/bridge/v1`) || PathPrefix(`/auth/v1`) || PathPrefix(`/graphql/v1`) || PathPrefix(`/pg/`)
      service: kong
      middlewares: [rate-limit, body-api, security-headers]
      priority: 80

    studio:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      service: kong
      middlewares: [rate-limit, security-headers-ui]
      priority: 1

    # Same origin as the web CS, so no CORS is needed and CSP connect-src 'self' works.
    nasabah:
      entryPoints: [console]
      rule: PathPrefix(`/api-nasabah`)
      service: nasabah-gateway
      middlewares: [rate-limit, body-api, security-headers]
      priority: 10

    # Security headers and CSP come from the cs-console nginx.
    cs-console:
      entryPoints: [console]
      rule: PathPrefix(`/`)
      service: cs-console
      middlewares: [rate-limit]
      priority: 1

  services:
    cs-console:
      loadBalancer:
        servers:
          - url: http://cs-console:8080
    nasabah-gateway:
      loadBalancer:
        servers:
          - url: http://nasabah-gateway:8080
