http:
  middlewares:
    # Generous per-IP default because many customers share one CGNAT or office Wi-Fi IP at peak
    # hours; per-account abuse is still capped by private.rate_limits and auth-bridge.
    rate-limit:
      rateLimit:
        average: {{ env "EDGE_RATE_AVERAGE" | default "600" }}
        burst: {{ env "EDGE_RATE_BURST" | default "1200" }}
        period: 1s
        sourceCriterion:
          ipStrategy:
            depth: 0

    # Concurrent Realtime WebSockets per IP: 1500 covers about 1,000 customers behind one
    # CGNAT/office IP (one socket each) plus reconnect headroom. Overall connections, joins, and
    # events are still capped by the Realtime tenant limits in compose.yml.
    ws-limit:
      inFlightReq:
        amount: {{ env "EDGE_WS_PER_IP" | default "1500" }}
        sourceCriterion:
          ipStrategy:
            depth: 0

    body-api:
      buffering:
        maxRequestBodyBytes: {{ env "EDGE_BODY_MAX_API" | default "262144" }}
        memRequestBodyBytes: 262144
    body-upload:
      buffering:
        maxRequestBodyBytes: {{ env "EDGE_BODY_MAX_UPLOAD" | default "10485760" }}
        memRequestBodyBytes: 1048576
    body-integration:
      buffering:
        maxRequestBodyBytes: {{ env "EDGE_BODY_MAX_INTEGRATION" | default "2097152" }}
        memRequestBodyBytes: 1048576

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    # For web pages (Studio): Next.js needs inline scripts and styles.
    security-headers-ui:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: same-origin
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        customResponseHeaders:
          Server: ""
          X-Powered-By: ""

    # HTTPS profiles only (single/cluster).
    hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true

  services:
    kong:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://kong:8000
