# Web CS and agent API routers (single profile with CS=1, and cluster).
# Every router on CS_CONSOLE_DOMAIN is limited to VPN_SOURCE_RANGES (office LAN or VPN).
# Page security headers (CSP, HSTS, ...) are set by the cs-console nginx.
# The cs_api schema and /functions/v1/cs-admin are fully reachable only on this domain; prod.yml restricts them.
# cs-edge strips X-Olt-Edge on REST, Realtime, and Storage so staff JWTs are accepted.
http:
  middlewares:
    cs-edge:
      headers:
        customRequestHeaders:
          X-Olt-Edge: ""

    vpn-only:
      ipAllowList:
        sourceRange: [{{ env "VPN_SOURCE_RANGES" }}]

  routers:
    cs-realtime:
      entryPoints: [websecure]
      rule: Host(`{{ env "CS_CONSOLE_DOMAIN" }}`) && PathPrefix(`/realtime/v1`)
      service: kong
      middlewares: [vpn-only, cs-edge, ws-limit, rate-limit, hsts, security-headers]
      tls:
        certResolver: le
      priority: 100

    cs-storage-upload:
      entryPoints: [websecure]
      rule: Host(`{{ env "CS_CONSOLE_DOMAIN" }}`) && PathPrefix(`/storage/v1`) && (Method(`POST`) || Method(`PUT`))
      service: kong
      middlewares: [vpn-only, cs-edge, rate-limit, body-upload, hsts, security-headers]
      tls:
        certResolver: le
      priority: 95

    cs-api:
      entryPoints: [websecure]
      rule: Host(`{{ env "CS_CONSOLE_DOMAIN" }}`) && (PathPrefix(`/rest/v1`) || PathPrefix(`/auth/v1`) || PathPrefix(`/functions/v1`) || PathPrefix(`/storage/v1`))
      service: kong
      middlewares: [vpn-only, cs-edge, rate-limit, body-api, hsts, security-headers]
      tls:
        certResolver: le
      priority: 80

    cs-nasabah:
      entryPoints: [websecure]
      rule: Host(`{{ env "CS_CONSOLE_DOMAIN" }}`) && PathPrefix(`/api-nasabah`)
      service: nasabah-gateway
      middlewares: [vpn-only, rate-limit, body-api, hsts, security-headers]
      tls:
        certResolver: le
      priority: 90

    cs-console:
      entryPoints: [websecure]
      rule: Host(`{{ env "CS_CONSOLE_DOMAIN" }}`)
      service: cs-console
      middlewares: [vpn-only, rate-limit, hsts]
      tls:
        certResolver: le
      priority: 1

  services:
    cs-console:
      loadBalancer:
        servers:
          - url: http://cs-console:8080
    nasabah-gateway:
      loadBalancer:
        servers:
          - url: http://nasabah-gateway:8080
