# Single (and cluster) routers: HTTPS on the `websecure` entrypoint.
#
# Only the paths the OLT app uses are public: REST/RPC, Realtime, Storage, media upload
# (/media/v1), auth-bridge, and the OLT integration gateway (/integration/v1, server-to-server
# with an API key). /auth/v1 (GoTrue is not used by clients), /functions/v1 (cs-admin is for the
# web CS only, see cs.yml), /graphql/v1, /pg, and Studio are NOT published; other paths are 404.
#
# Staff API: on the public domain the cs_api schema only serves the customer-app CS chat RPCs
# (api-cs-customer, same list as the cs_api calls in rendezvous_community). Any other cs_api
# request (Accept-Profile/Content-Profile) gets 403 (api-cs-staff-block), and the api router
# strips the profile headers so only the public schema is reachable. Agent RPCs and cs-admin
# go only through CS_CONSOLE_DOMAIN (ipAllowList VPN_SOURCE_RANGES).
# Public REST, Realtime, Storage, and media routers set X-Olt-Edge: public (overwriting any
# client value). The DB rejects CS-account JWTs carrying it: REST via private.check_request,
# Realtime (join/presence) and Storage (all buckets) via RLS; media forwards it to Storage.
# postgres_changes is rejected for CS accounts on every domain.
#
# The `admin` entrypoint (all paths, including Studio) is bound to the server's 127.0.0.1
# only; reach it over WireGuard or an SSH tunnel. See docs/PRODUCTION.md.
http:
  middlewares:
    public-edge:
      headers:
        customRequestHeaders:
          X-Olt-Edge: public

    public-schema-only:
      headers:
        customRequestHeaders:
          Accept-Profile: ""
          Content-Profile: ""

    staff-api-deny:
      ipAllowList:
        sourceRange: ["255.255.255.255/32"]

  routers:
    realtime:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/realtime/v1`)
      service: kong
      middlewares: [ws-limit, rate-limit, public-edge, hsts, security-headers]
      tls:
        certResolver: le
      priority: 100

    storage-upload:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/storage/v1`) && (Method(`POST`) || Method(`PUT`))
      service: kong
      middlewares: [rate-limit, public-edge, body-upload, hsts, security-headers]
      tls:
        certResolver: le
      priority: 95

    media-upload:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/media/v1`)
      service: kong
      middlewares: [rate-limit, public-edge, body-upload, hsts, security-headers]
      tls:
        certResolver: le
      priority: 95

    integration:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/integration/v1`)
      service: kong
      middlewares: [rate-limit, body-integration, hsts, security-headers]
      tls:
        certResolver: le
      priority: 85

    storage:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/storage/v1`)
      service: kong
      middlewares: [rate-limit, public-edge, hsts, security-headers]
      tls:
        certResolver: le
      priority: 90

    api-cs-customer:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathRegexp(`^/rest/v1/rpc/(support_home|topics|open_ticket|my_tickets|ticket_messages|close_ticket|rate_ticket|request_complaint|report_fake_cs|check_sensitive|get_messages|send_message|mark_read|room_members|faq|faq_search|faq_article|faq_feedback|faq_for_topic|attachment_policy)$`)
      service: kong
      middlewares: [rate-limit, public-edge, body-api, hsts, security-headers]
      tls:
        certResolver: le
      priority: 83

    api-cs-staff-block:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && PathPrefix(`/rest/v1`) && (HeaderRegexp(`Accept-Profile`, `(?i)cs_api`) || HeaderRegexp(`Content-Profile`, `(?i)cs_api`))
      service: kong
      middlewares: [rate-limit, hsts, security-headers, staff-api-deny, body-api]
      tls:
        certResolver: le
      priority: 82

    api:
      entryPoints: [websecure]
      rule: Host(`{{ env "PROXY_DOMAIN" }}`) && (PathPrefix(`/rest/v1`) || PathPrefix(`/bridge/v1`))
      service: kong
      middlewares: [rate-limit, public-edge, public-schema-only, body-api, hsts, security-headers]
      tls:
        certResolver: le
      priority: 80

    admin:
      entryPoints: [admin]
      rule: PathPrefix(`/`)
      service: kong
      middlewares: [security-headers-ui]
      priority: 1

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: {{ env "TLS_SNI_STRICT" | default "true" }}
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      curvePreferences:
        - X25519
        - CurveP256
        - CurveP384
