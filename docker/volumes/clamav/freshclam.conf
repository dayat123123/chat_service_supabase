# freshclam inside the clamav container (logs to stdout via --stdout); updates need outbound HTTPS to database.clamav.net.
Foreground yes
LogTime yes
PidFile /tmp/freshclam.pid
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 30
ReceiveTimeout 300
