# clamd for the media service (CS documents and videos, INSTREAM over TCP on the app network).
# No LogFile: clamd refuses symlinks such as /dev/stdout and logs to stderr in the foreground.
Foreground yes
LogTime yes
LogClean no
ExtendedDetectionInfo yes
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
MaxConnectionQueueLength 30
MaxThreads 4
ReadTimeout 60
CommandReadTimeout 10
StreamMaxLength 30M
MaxScanSize 200M
MaxFileSize 100M
MaxRecursion 16
MaxFiles 2000
SelfCheck 3600
# One copy of the signatures in memory: a reload pauses scans for a few seconds instead of doubling RAM.
ConcurrentDatabaseReload no
