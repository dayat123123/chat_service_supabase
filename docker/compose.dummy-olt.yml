# Tambahan profil dev: auth-bridge memverifikasi token ke OLT DUMMY
# (services/dummy-olt) lewat jalur WebSocket yang sama dengan produksi.
# Yang berubah hanya KONFIGURASI auth-bridge (OLT_MODE + OLT_WS_URL), bukan kodenya:
# dummy berbicara Protokol v1, sama dengan default auth-bridge, persis seperti produksi.
#
#   make up DUMMY_OLT=1          Windows: .\make.ps1 up -DummyOlt
#   make down DUMMY_OLT=1        (ikut menghentikan dummy-olt)
#
# JANGAN dipakai di produksi (Makefile hanya mengizinkannya di profil dev).

services:
  dummy-olt:
    build:
      context: ../services/dummy-olt
    image: olt-social/dummy-olt:0.2.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # app: dijangkau auth-bridge. egress: port host untuk app contoh / curl.
    networks: [app, egress]
    ports:
      - ${EDGE_HTTP_BIND:-127.0.0.1}:${DUMMY_OLT_PORT:-8090}:8090/tcp
    environment:
      PORT: 8090
      DUMMY_OLT_SECRET: ${DUMMY_OLT_SECRET:-dummy-olt-dev-secret-jangan-dipakai-di-produksi}
      DUMMY_OLT_TOKEN_TTL: ${DUMMY_OLT_TOKEN_TTL:-24h}
      DUMMY_OLT_ACCEPT_MOCK_TOKENS: ${DUMMY_OLT_ACCEPT_MOCK_TOKENS:-true}
      DUMMY_OLT_SLOW_DELAY: ${DUMMY_OLT_SLOW_DELAY:-8s}
    healthcheck:
      # Image distroless: binary menyediakan subcommand healthcheck.
      test: ["CMD", "/dummy-olt", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M, pids: 64}

  # Cukup URL: format pesan memakai default Protokol v1 (OLT_WS_* kosong).
  auth-bridge:
    depends_on:
      dummy-olt:
        condition: service_healthy
    environment:
      OLT_MODE: websocket
      OLT_WS_URL: ws://dummy-olt:8090/ws
