# Dev-only overlay: dummy-olt issues signed social tokens and auth-bridge verifies them with the
# public key (jwt mode), exactly like production; only auth-bridge configuration changes.
# Never use it in production (the Makefile only allows it with the dev profile).

services:
  dummy-olt:
    build:
      context: ../services/dummy-olt
    image: olt-social/dummy-olt:0.4.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # app: reached by the smoke tests in the tools container. egress: host port for the sample app and curl.
    networks: [app, egress]
    secrets: [olt_dev_signing_key]
    ports:
      - ${EDGE_HTTP_BIND:-127.0.0.1}:${DUMMY_OLT_PORT:-8090}:8090/tcp
    environment:
      PORT: 8090
      DUMMY_OLT_SECRET: ${DUMMY_OLT_SECRET:-dummy-olt-dev-secret-jangan-dipakai-di-produksi}
      DUMMY_OLT_TOKEN_TTL: ${DUMMY_OLT_TOKEN_TTL:-24h}
      DUMMY_OLT_ACCEPT_MOCK_TOKENS: ${DUMMY_OLT_ACCEPT_MOCK_TOKENS:-true}
      DUMMY_OLT_SLOW_DELAY: ${DUMMY_OLT_SLOW_DELAY:-8s}
      DUMMY_OLT_SIGNING_KEY_FILE: /run/secrets/olt_dev_signing_key
      DUMMY_OLT_SIGNING_KID: dev-olt-1
      DUMMY_OLT_SOCIAL_TTL: ${DUMMY_OLT_SOCIAL_TTL:-10m}
    healthcheck:
      # Distroless image: the binary provides its own healthcheck subcommand.
      test: ["CMD", "/dummy-olt", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M, pids: 64}

  # Verifies dummy social tokens with the public key in docker/secrets/olt_jwks, without calling dummy-olt.
  auth-bridge:
    environment:
      OLT_MODE: jwt

secrets:
  olt_dev_signing_key:
    file: ./secrets/olt_dev_signing_key
