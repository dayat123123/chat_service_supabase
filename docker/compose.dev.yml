# Developer laptop profile. CORS allows every origin and auth-bridge runs in mock mode, so never
# use it on a shared server.

services:
  traefik:
    ports:
      - ${EDGE_HTTP_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-8000}:8000/tcp
      - ${EDGE_HTTP_BIND:-127.0.0.1}:${CS_CONSOLE_PORT:-8085}:8085/tcp
    configs:
      - source: traefik-routes-dev
        target: /etc/traefik/dynamic/routes.yml
    environment:
      TRAEFIK_ENTRYPOINTS_CONSOLE_ADDRESS: ":8085"
      TRAEFIK_ENTRYPOINTS_CONSOLE_HTTP_ALIASHEADERSSTRATEGY: delete

  kong:
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

  auth-bridge:
    environment:
      APP_ENV: development
      LOG_LEVEL: ${AUTH_BRIDGE_LOG_LEVEL:-debug}
      OLT_MODE: ${AUTH_BRIDGE_OLT_MODE:-mock}
      # Tests and hot reload log in as the same user repeatedly; production uses 10.
      RATE_LIMIT_PER_USER_PER_MINUTE: ${AUTH_BRIDGE_RATE_LIMIT_PER_USER_PER_MINUTE:-60}

  cs-console:
    environment:
      SUPABASE_URL: http://localhost:${EDGE_HTTP_PORT:-8000}
      APP_ENV: development

  sentinel:
    networks: [app, data, edge, egress]
    environment:
      PROBES_EXTRA: cs-console=http://cs-console:8080/healthz,nasabah-gateway=http://nasabah-gateway:8080/healthz

configs:
  traefik-routes-dev:
    file: ./volumes/traefik/dev.yml
