# Docker Swarm overlay for compose.yml. Still a skeleton that has not been fully tested; see
# docs/scaling.md for prerequisites and migration. It only overrides deploy settings: images, service
# names, and env names stay the same. Swarm ignores depends_on, build, security_opt, shm_size, and
# network_mode, so self-built images must be pushed to ${REGISTRY}/olt-social/... first.

x-deploy: &deploy
  restart_policy:
    condition: any
    delay: 5s
  update_config:
    parallelism: 1
    order: start-first
    failure_action: rollback
    monitor: 30s
  rollback_config:
    parallelism: 1
    order: stop-first

services:
  traefik:
    ports:
      - target: 8080
        published: 80
        mode: host
      - target: 8443
        published: 443
        mode: host
    configs:
      - source: traefik-routes-prod
        target: /etc/traefik/dynamic/routes.yml
      - source: traefik-routes-cs
        target: /etc/traefik/dynamic/cs.yml
    environment:
      CS_CONSOLE_DOMAIN: ${CS_CONSOLE_DOMAIN:?CS_CONSOLE_DOMAIN is required}
      VPN_SOURCE_RANGES: ${VPN_SOURCE_RANGES:?VPN_SOURCE_RANGES is required}
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8080"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: ":443"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":8443"
      TRAEFIK_ENTRYPOINTS_ADMIN_ADDRESS: ":9000"
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_STORAGE: /acme/acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_LE_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      PROXY_DOMAIN: ${PROXY_DOMAIN:?PROXY_DOMAIN is required}
      # Rate limits are counted per Traefik instance; they are not shared across nodes yet.
    volumes:
      - traefik-acme:/acme
    deploy:
      <<: *deploy
      # One instance per manager; ACME certificates live on that node's volume, not on shared storage.
      mode: global
      placement:
        constraints: [node.role == manager]

  kong:
    deploy:
      <<: *deploy
      replicas: 2
  auth:
    deploy:
      <<: *deploy
      replicas: 2
  rest:
    deploy:
      <<: *deploy
      replicas: 2
  realtime:
    environment:
      CLUSTER_STRATEGIES: DNS
      DNS_NODES: tasks.realtime
    deploy:
      <<: *deploy
      replicas: 2
  storage:
    environment:
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:?GLOBAL_S3_BUCKET is required}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT:?GLOBAL_S3_ENDPOINT is required}
      AWS_ACCESS_KEY_ID: "{{secret:storage_s3_access_key_id}}"
      AWS_SECRET_ACCESS_KEY: "{{secret:storage_s3_secret_access_key}}"
    secrets: [anon_key, service_role_key, jwt_secret, postgres_password, s3_protocol_access_key_id, s3_protocol_access_key_secret, storage_s3_access_key_id, storage_s3_secret_access_key]
    deploy:
      <<: *deploy
      replicas: 2
  imgproxy:
    deploy:
      <<: *deploy
      replicas: 2
  functions:
    deploy:
      <<: *deploy
      replicas: 2
  auth-bridge:
    image: ${REGISTRY:?REGISTRY is required}/olt-social/auth-bridge:0.6.0
    deploy:
      <<: *deploy
      replicas: 2
  notifier:
    image: ${REGISTRY}/olt-social/notifier:0.2.0
    deploy:
      <<: *deploy
      replicas: 2
  janitor:
    image: ${REGISTRY}/olt-social/janitor:0.2.0
    deploy:
      <<: *deploy
      replicas: 1
  media:
    image: ${REGISTRY}/olt-social/media:0.2.1
    deploy:
      <<: *deploy
      replicas: 2
  classifier:
    image: ${REGISTRY}/olt-social/classifier:0.1.1
    deploy:
      <<: *deploy
      replicas: 2
  integration:
    image: ${REGISTRY}/olt-social/integration:0.2.0
    deploy:
      <<: *deploy
      replicas: 2
  link-preview:
    image: ${REGISTRY}/olt-social/link-preview:0.2.0
    deploy:
      <<: *deploy
      replicas: 1
  # Sentinel measures the disk of the node it runs on, so it is pinned to the DB node.
  sentinel:
    image: ${REGISTRY}/olt-social/sentinel:0.4.0
    environment:
      # tasks.<service> scrapes each replica directly because counters are per replica; the VIP would mix them.
      METRICS_SOURCES: ${SENTINEL_METRICS_SOURCES:-rest=http://tasks.rest:3001/metrics,realtime=jwt+http://tasks.realtime:4000/metrics,pgbouncer=pgbouncer://olt_stats@tasks.pgbouncer:6432}
      # Healer does not run in the cluster, so its state is not read (no false healer:stale alert).
      HEALER_STATE_FILE: ""
    deploy:
      <<: *deploy
      replicas: 1
      placement:
        constraints: [node.labels.olt.db == primary]
  # Swarm already replaces unhealthy tasks; healer (auto-restart through the Docker socket) is for the
  # single/dev profiles only.
  healer:
    image: ${REGISTRY}/olt-social/healer:0.1.0
    deploy:
      replicas: 0
  # Cluster file storage lives in SeaweedFS (S3), so restic here backs up the database only.
  # For a "Folder lokal" destination in the cluster, set BACKUP_LOCAL_REPO_DIR to an absolute path on the DB node.
  backup:
    image: ${REGISTRY}/olt-social/backup:0.2.0
    deploy:
      <<: *deploy
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
      placement:
        constraints: [node.labels.olt.db == primary]
  cs-console:
    image: ${REGISTRY}/olt-social/cs-console:0.1.1
    environment:
      SUPABASE_URL: https://${CS_CONSOLE_DOMAIN}
    deploy:
      <<: *deploy
      replicas: 2
  pgbouncer:
    image: ${REGISTRY}/olt-social/pgbouncer:1.24.0-5
    deploy:
      <<: *deploy
      replicas: 2
  valkey:
    deploy:
      <<: *deploy
      replicas: 1
  db:
    deploy:
      <<: *deploy
      replicas: 1
      # The primary stays on one node (local volume), so a DB rolling update must never be start-first.
      update_config:
        parallelism: 1
        order: stop-first
      placement:
        constraints: [node.labels.olt.db == primary]
  migrate:
    image: ${REGISTRY}/olt-social/tools:0.1.0
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 10
        delay: 10s
  tools:
    image: ${REGISTRY}/olt-social/tools:0.1.0
    deploy:
      replicas: 0
  studio:
    deploy:
      replicas: 0
  meta:
    deploy:
      replicas: 0
  volume-init:
    deploy:
      replicas: 0

networks:
  edge:
    driver: overlay
    driver_opts:
      encrypted: "true"
  app:
    driver: overlay
    driver_opts:
      encrypted: "true"
  data:
    driver: overlay
    driver_opts:
      encrypted: "true"
  egress:
    driver: overlay
    driver_opts:
      encrypted: "true"

configs:
  traefik-routes-prod:
    file: ./volumes/traefik/prod.yml
  traefik-routes-cs:
    file: ./volumes/traefik/cs.yml

secrets:
  storage_s3_access_key_id:
    file: ./secrets/storage_s3_access_key_id
  storage_s3_secret_access_key:
    file: ./secrets/storage_s3_secret_access_key
