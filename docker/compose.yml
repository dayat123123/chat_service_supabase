# Base stack shared by every profile (dev: + compose.dev.yml, single: + compose.prod.yml,
# cluster: + stack.cluster.yml). Derived from supabase/supabase docker/ at commit 6a421fe,
# without Analytics (Logflare), Vector, and Supavisor.
#
# - Profiles only change configuration; images, service names, and env names stay identical.
# - Secrets come only from Docker secrets: env values hold {{secret:name}} placeholders that
#   volumes/olt/with-secrets.sh fills in.
# - Only Traefik publishes ports. Networks: edge (Traefik <-> Kong), app (Kong <-> API services),
#   data (Postgres, PgBouncer, Valkey and their clients), egress (internet or host ports only).
# - Apps reach Postgres through PgBouncer, except Realtime (logical replication), backup
#   (physical replication), and migrate/tools (superuser DB operations).

name: olt-social

x-base: &base
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  traefik:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    user: "65532:65532"
    networks: [edge, egress]
    depends_on:
      kong:
        condition: service_healthy
    stop_grace_period: 30s
    tmpfs:
      # Holds request/response bodies buffered by the `buffering` middleware.
      - /tmp:size=256m,mode=1777
    configs:
      - source: traefik-common
        target: /etc/traefik/dynamic/common.yml
    environment:
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-INFO}
      TRAEFIK_LOG_FORMAT: json
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_ACCESSLOG_FORMAT: json
      # Headers are never logged (they can carry tokens).
      TRAEFIK_ACCESSLOG_FIELDS_HEADERS_DEFAULTMODE: drop
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"
      # Ping (healthcheck) and Prometheus metrics only on the internal port 8082.
      TRAEFIK_ENTRYPOINTS_PING_ADDRESS: ":8082"
      TRAEFIK_ENTRYPOINTS_PING_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_PING: "true"
      TRAEFIK_PING_ENTRYPOINT: ping
      TRAEFIK_METRICS_PROMETHEUS: "true"
      TRAEFIK_METRICS_PROMETHEUS_ENTRYPOINT: ping
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":8000"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_MAXHEADERBYTES: "32768"
      # Drops headers whose names alias another header (X_Forwarded_For) and rejects encoded
      # path characters that a backend could misinterpret.
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDNULLCHARACTER: "false"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDBACKSLASH: "false"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSLASH: "false"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDHASH: "false"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDQUESTIONMARK: "false"
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEDCHARACTERS_ALLOWENCODEDSEMICOLON: "false"
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_RESPONDINGTIMEOUTS_READTIMEOUT: 60s
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_RESPONDINGTIMEOUTS_IDLETIMEOUT: 180s
      TRAEFIK_ENTRYPOINTS_WEB_TRANSPORT_LIFECYCLE_GRACETIMEOUT: 20s
      TRAEFIK_SERVERSTRANSPORT_FORWARDINGTIMEOUTS_DIALTIMEOUT: 5s
      # Edge Functions may run for up to ~150 s (runtime idle timeout).
      TRAEFIK_SERVERSTRANSPORT_FORWARDINGTIMEOUTS_RESPONSEHEADERTIMEOUT: 170s
      # Per-IP edge limits, consumed by volumes/traefik/common.yml.
      EDGE_RATE_AVERAGE: ${EDGE_RATE_AVERAGE:-600}
      EDGE_RATE_BURST: ${EDGE_RATE_BURST:-1200}
      EDGE_WS_PER_IP: ${EDGE_WS_PER_IP:-1500}
      EDGE_BODY_MAX_API: ${EDGE_BODY_MAX_API:-262144}
      EDGE_BODY_MAX_UPLOAD: ${EDGE_BODY_MAX_UPLOAD:-27262976}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        # About 0.26 MiB per proxied WebSocket (measured: 300 -> 122 MiB, 800 -> 254 MiB).
        # 768M fits EDGE_WS_PER_IP 1500 from one IP plus connections from other IPs.
        limits: {cpus: "1", memory: 768M, pids: 256}

  kong:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: kong/kong:3.9.4@sha256:da2afeecfec0561dd2e06612b09c6283d79245a0387acdc3715271dbf5691a05
    networks: [edge, app]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    tmpfs:
      # KONG_PREFIX (nginx.conf, pid, socket) and the substituted declarative config.
      - /tmp:size=64m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
      - source: kong-config
        target: /home/kong/temp.yml
      - source: kong-entrypoint
        target: /home/kong/kong-entrypoint.sh
    secrets: [anon_key, service_role_key, dashboard_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "/bin/sh", "/home/kong/kong-entrypoint.sh"]
    environment:
      KONG_DATABASE: "off"
      KONG_PREFIX: /tmp/kong
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      # nginx defaults to one worker per host core; capped to keep memory bounded.
      KONG_NGINX_WORKER_PROCESSES: ${KONG_WORKER_PROCESSES:-2}
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: "off"
      # Real client IP from X-Forwarded-For, only when the request comes from Traefik (edge network).
      KONG_TRUSTED_IPS: ${EDGE_SUBNET:-10.250.250.0/24}
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      SUPABASE_ANON_KEY: "{{secret:anon_key}}"
      SUPABASE_SERVICE_KEY: "{{secret:service_role_key}}"
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: "{{secret:dashboard_password}}"
      # Empty allows no web origin (secure by default). Dev uses "*".
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "2", memory: "${KONG_MEMORY:-1G}", pids: 256}

  auth:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    networks: [app, data]
    depends_on:
      pgbouncer:
        condition: service_healthy
    tmpfs:
      - /tmp:size=16m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [jwt_secret, postgres_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh"]
    command: ["auth"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:{{secret:postgres_password}}@${DB_POOLER_HOST:-pgbouncer}:${DB_POOLER_PORT:-6432}/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      # OLT users never sign up through GoTrue; auth-bridge issues their JWTs.
      # Email + password login is for staff accounts only. The web CS does not use TOTP; moderation admins still require TOTP (aal2).
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: "{{secret:jwt_secret}}"
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 128}

  rest:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    networks: [app, data]
    depends_on:
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 15s
    # Shell-less image: secrets are read straight from files (PostgREST @file syntax).
    secrets: [jwt_secret, postgrest_db_uri]
    configs:
      - source: rest-pg-service
        target: /etc/olt/pg_service.conf
    environment:
      PGRST_DB_URI: "@/run/secrets/postgrest_db_uri"
      # libpq keepalive/tcp_user_timeout detect a hung connection in about 8 s, so /ready returns 503
      # and the healthcheck below marks rest unhealthy (volumes/rest/pg_service.conf).
      PGSERVICEFILE: /etc/olt/pg_service.conf
      PGSERVICE: rest
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public,cs_api}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_POOL: ${PGRST_DB_POOL:-10}
      # When the pool is exhausted, fail fast after 2 s (PGRST003, 504) instead of queueing for 10 s.
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: ${PGRST_DB_POOL_ACQUISITION_TIMEOUT:-2}
      # GHC runtime capabilities follow the CPU limit below. The image default (-N) creates one per host
      # core; under a 1 vCPU quota rest collapsed at about 90 req/s and never recovered.
      GHCRTS: ${PGRST_GHCRTS:--N1}
      PGRST_DB_ANON_ROLE: anon
      # The admin server (/live, /ready, /metrics, /schema_cache) stays on the internal network: it is
      # never published or routed by Kong/Traefik. Sentinel reads its /metrics (PostgREST pool).
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: 0.0.0.0
      PGRST_JWT_SECRET: "@/run/secrets/jwt_secret"
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      # On every request, reject banned users and JWTs whose session was revoked.
      PGRST_DB_PRE_REQUEST: private.check_request
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      # A fresh database has no cs_api schema until migrate (which waits for storage) has run.
      start_period: 300s
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 256}

  realtime:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: supabase/realtime:v2.148.6@sha256:d18b6f4c54413ca6536531befc84663d96435e55efbbfb124dfb82e30e8240dc
    networks:
      app:
        # Realtime derives the tenant id from the hostname (realtime-dev); Kong uses this name.
        aliases: [realtime-dev.supabase-realtime]
      data: {}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [postgres_password, jwt_secret, secret_key_base, realtime_db_enc_key, realtime_erlang_cookie]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "/usr/bin/tini", "-s", "-g", "--", "/app/run.sh"]
    command: ["/app/bin/server"]
    environment:
      PORT: 4000
      # Direct connection, not PgBouncer: Realtime needs logical replication.
      DB_HOST: ${POSTGRES_HOST:-db}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: supabase_admin
      DB_PASSWORD: "{{secret:postgres_password}}"
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: "{{secret:realtime_db_enc_key}}"
      API_JWT_SECRET: "{{secret:jwt_secret}}"
      SECRET_KEY_BASE: "{{secret:secret_key_base}}"
      METRICS_JWT_SECRET: "{{secret:jwt_secret}}"
      # Erlang cookie, used when Realtime is clustered (cluster profile).
      RELEASE_COOKIE: "{{secret:realtime_erlang_cookie}}"
      RELEASE_TMP: /tmp
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      # Must match the tenant region seeded by self-host (fixed to "us-east-1" in the image).
      # Otherwise (default "local") Realtime drops the tenant DB connection every 10 minutes
      # ("Rebalancing ... for a closer region") and database broadcasts (message ticks) are lost.
      REGION: us-east-1
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      # Tenant limits, re-seeded from env on every start (SEED_SELF_HOST). Chat messages use database
      # broadcast (0098), so every event delivered to each client counts. See docs/PRODUCTION.md.
      TENANT_MAX_CONCURRENT_USERS: ${REALTIME_MAX_CONCURRENT_USERS:-10000}
      TENANT_MAX_EVENTS_PER_SECOND: ${REALTIME_MAX_EVENTS_PER_SECOND:-20000}
      TENANT_MAX_CHANNELS_PER_CLIENT: ${REALTIME_MAX_CHANNELS_PER_CLIENT:-100}
      TENANT_MAX_JOINS_PER_SECOND: ${REALTIME_MAX_JOINS_PER_SECOND:-500}
      TENANT_MAX_BYTES_PER_SECOND: ${REALTIME_MAX_BYTES_PER_SECOND:-1000000}
    healthcheck:
      test: ["CMD", "curl", "-sSf", "-o", "/dev/null", "http://localhost:4000/healthcheck"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits: {cpus: "2", memory: "${REALTIME_MEMORY:-1G}", pids: 512}

  storage:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: supabase/storage-api:v1.84.32@sha256:2575a2b7b741feb6eab98089dd60127955ad18c0abe760214653ea2cbcbf7209
    user: "1000:1000"
    networks: [app, data]
    depends_on:
      volume-init:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    tmpfs:
      - /tmp:size=256m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [anon_key, service_role_key, jwt_secret, postgres_password, s3_protocol_access_key_id, s3_protocol_access_key_secret]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "docker-entrypoint.sh"]
    command: ["node", "dist/start/server.js"]
    environment:
      ANON_KEY: "{{secret:anon_key}}"
      SERVICE_KEY: "{{secret:service_role_key}}"
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: "{{secret:jwt_secret}}"
      DATABASE_URL: postgres://supabase_storage_admin:{{secret:postgres_password}}@${DB_POOLER_HOST:-pgbouncer}:${DB_POOLER_PORT:-6432}/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Global limit; per-bucket limits (avatars/attachments) are set in migrations.
      FILE_SIZE_LIMIT: 52428800
      # `file` (volume) in dev/single. Switching to S3/SeaweedFS only needs env:
      # STORAGE_BACKEND=s3 + GLOBAL_S3_* (see docs/scaling.md).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-file}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      GLOBAL_S3_ENDPOINT: ${GLOBAL_S3_ENDPOINT:-}
      GLOBAL_S3_PROTOCOL: ${GLOBAL_S3_PROTOCOL:-https}
      GLOBAL_S3_FORCE_PATH_STYLE: ${GLOBAL_S3_FORCE_PATH_STYLE:-true}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ACCESS_KEY_ID: "{{secret:s3_protocol_access_key_id}}"
      S3_PROTOCOL_ACCESS_KEY_SECRET: "{{secret:s3_protocol_access_key_secret}}"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 128}

  imgproxy:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: darthsim/imgproxy:v3.31.4@sha256:73c5dda13199745b0d2d00e4149d4a589c5b2e205dbf335ca05eca8276b54712
    networks: [app]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - storage-data:/var/lib/storage:ro
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP:-true}
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 128}

  meta:
    <<: *base
    image: supabase/postgres-meta:v0.100.0@sha256:145325b7e39f8ef4931d6e8cfd3f6f4d655de09d72a2ccc96d9513542c2202bd
    user: "1000:1000"
    networks: [app, data]
    depends_on:
      pgbouncer:
        condition: service_healthy
    tmpfs:
      - /tmp:size=32m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [postgres_password, pg_meta_crypto_key]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "docker-entrypoint.sh"]
    command: ["node", "dist/server/server.js"]
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${DB_POOLER_HOST:-pgbouncer}
      PG_META_DB_PORT: ${DB_POOLER_PORT:-6432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: "{{secret:postgres_password}}"
      CRYPTO_KEY: "{{secret:pg_meta_crypto_key}}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 5s
      interval: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 128}

  # Admin dashboard. Off by default in single/cluster (profile `admin`).
  studio:
    <<: *base
    image: supabase/studio:2026.10.26-sha-478bd88@sha256:b733f739a7d41bf33c86f52dffbddde6b9dee82f9aa451811cdb62709ea9e88b
    user: "1000:1000"
    networks: [app]
    depends_on:
      meta:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/studio/.next/cache:size=128m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [postgres_password, pg_meta_crypto_key, anon_key, service_role_key, jwt_secret]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "docker-entrypoint.sh"]
    command: ["node", "apps/studio/server.js"]
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: ${DB_POOLER_HOST:-pgbouncer}
      POSTGRES_PORT: ${DB_POOLER_PORT:-6432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: "{{secret:postgres_password}}"
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: "{{secret:pg_meta_crypto_key}}"
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public,cs_api}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-OLT}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-OLT Social}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: "{{secret:anon_key}}"
      SUPABASE_SERVICE_KEY: "{{secret:service_role_key}}"
      AUTH_JWT_SECRET: "{{secret:jwt_secret}}"
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - ./volumes/snippets:/app/snippets
      - ./volumes/functions:/app/edge-functions:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G, pids: 128}

  functions:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: supabase/edge-runtime:v1.77.9@sha256:6b850a2ccf0bf50ecac9accff8098095cd191c389c2a53c59b857aa0f53a8343
    user: "65534:65534"
    # egress: downloads remote Deno imports the first time a function runs.
    networks: [app, egress]
    depends_on:
      volume-init:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:size=128m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [jwt_secret, anon_key, service_role_key]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "edge-runtime"]
    command: ["start", "--user-worker-request-idle-timeout", "150000", "--main-service", "/home/deno/functions/main"]
    environment:
      JWT_SECRET: "{{secret:jwt_secret}}"
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: "{{secret:anon_key}}"
      SUPABASE_SERVICE_ROLE_KEY: "{{secret:service_role_key}}"
      SUPABASE_PUBLISHABLE_KEYS: '{"default":""}'
      SUPABASE_SECRET_KEYS: '{"default":""}'
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT:-true}"
      DENO_DIR: /var/cache/deno
      HOME: /tmp
    volumes:
      - ./volumes/functions:/home/deno/functions:ro
      - deno-cache:/var/cache/deno
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 256}

  db:
    <<: *base
    image: supabase/postgres:17.11.0.008@sha256:fef2654e52424e2748b1cd6763b73afcb2618c6ec696bd3af5ad572687be1dc7
    networks: [data]
    # The entrypoint starts as root to prepare directories, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    stop_grace_period: 60s
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/run/postgresql:size=16m
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
      - source: db-realtime
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
      # Must be superuser to create event trigger
      - source: db-webhooks
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
      # Must be superuser to alter reserved role
      - source: db-roles
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      - source: db-jwt
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
      # Image pg_hba plus replication access for the backup service (role olt_backup)
      - source: db-hba
        target: /etc/postgresql/pg_hba.conf
    secrets: [postgres_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "docker-entrypoint.sh"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    volumes:
      - db-data:/var/lib/postgresql/data
      # Persists the pgsodium key so it stays the same across restarts
      - db-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPASSWORD: "{{secret:postgres_password}}"
      POSTGRES_PASSWORD: "{{secret:postgres_password}}"
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "2", memory: "${DB_MEMORY:-2G}", pids: 512}

  pgbouncer:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ./pgbouncer
    image: olt-social/pgbouncer:1.24.0-5
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      - /tmp:size=16m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [postgres_password, pgbouncer_stats_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "/bin/sh", "/usr/local/bin/pgbouncer-entrypoint.sh"]
    environment:
      # Password of the `pgbouncer` user (set equal to POSTGRES_PASSWORD by volumes/db/roles.sql).
      PGBOUNCER_AUTH_PASSWORD: "{{secret:postgres_password}}"
      # `olt_stats` user: admin console SHOW only, used by sentinel for PgBouncer queue alerts.
      PGBOUNCER_STATS_PASSWORD: "{{secret:pgbouncer_stats_password}}"
      PGBOUNCER_SERVER_LOGIN_RETRY: ${PGBOUNCER_SERVER_LOGIN_RETRY:-0.25}
      PGBOUNCER_DB_HOST: ${POSTGRES_HOST:-db}
      PGBOUNCER_DB_PORT: ${POSTGRES_PORT:-5432}
      # Re-resolve the database host every N s so a new IP is used without waiting for the c-ares DNS cache.
      PGBOUNCER_DB_WATCH_SECONDS: ${PGBOUNCER_DB_WATCH_SECONDS:-2}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE:-session}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-80}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6432"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 64}

  # Distributed rate limits, cache, and locks for auth-bridge and Traefik.
  # No persistence: contents may be lost on restart.
  valkey:
    <<: *base
    image: valkey/valkey:9.0.7-alpine@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
    user: "999:1000"
    networks: [data]
    tmpfs:
      - /data:size=16m
      - /tmp:size=16m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [valkey_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf 'requirepass %s\n' "$$VALKEY_PASSWORD" > /tmp/valkey.conf
        exec valkey-server /tmp/valkey.conf --save "" --appendonly no \
          --maxmemory "$${VALKEY_MAXMEMORY:-192mb}" --maxmemory-policy volatile-lru
    environment:
      VALKEY_PASSWORD: "{{secret:valkey_password}}"
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:-192mb}
    healthcheck:
      # No password needed: even a NOAUTH reply means the server is up.
      test: ["CMD-SHELL", "valkey-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M, pids: 64}

  # Aligns volume ownership with the services' non-root users (one-shot, idempotent).
  volume-init:
    image: alpine:3.22.7@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - storage-data:/volumes/storage
      - deno-cache:/volumes/deno
      - traefik-acme:/volumes/acme
    command:
      - sh
      - -c
      - |
        set -e
        own() { [ "$$(stat -c %u:%g "$$1")" = "$$2" ] || chown -R "$$2" "$$1"; }
        own /volumes/storage 1000:1000
        own /volumes/deno 65534:65534
        own /volumes/acme 65532:65532
        chmod 700 /volumes/acme

  # One-shot: applies pending OLT migrations, then exits.
  # Waits for auth/storage/realtime to be healthy because migrations use their schemas
  # (storage.buckets, realtime.messages). Connects directly to the DB as superuser.
  migrate:
    <<: *base
    restart: "no"
    build:
      context: ./tools
    image: olt-social/tools:0.1.0
    user: "1000:1000"
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
      realtime:
        condition: service_healthy
    tmpfs:
      - /tmp:size=64m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    secrets: [postgres_password, backup_db_password]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "bash", "/olt/scripts/tools.sh"]
    command: ["migrate"]
    volumes:
      - ../scripts:/olt/scripts:ro
      - ../supabase:/olt/supabase:ro
    environment:
      HOME: /tmp
      PGHOST: ${POSTGRES_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: "{{secret:postgres_password}}"

  auth-bridge:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/auth-bridge
    image: olt-social/auth-bridge:0.6.0
    # No egress: OLT tokens are verified locally with the OLT public key (jwt mode),
    # so auth-bridge never calls OLT. data: Valkey.
    networks: [app, data]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
      valkey:
        condition: service_healthy
    stop_grace_period: 20s
    secrets: [jwt_secret, valkey_password, olt_jwks]
    environment:
      PORT: 8080
      # Internal /metrics, /livez, /readyz port (not published, not routed through Kong).
      OPS_PORT: 9100
      # Secure by default: production. The dev profile overrides it to development.
      APP_ENV: production
      LOG_LEVEL: ${AUTH_BRIDGE_LOG_LEVEL:-info}
      # Distroless image (no shell): auth-bridge reads the secret from the file itself.
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_TTL: ${AUTH_BRIDGE_JWT_TTL:-900}
      # Profile upserts go through internal PostgREST (service_role-only RPC).
      POSTGREST_URL: http://rest:3000
      # Rate limits and the verification cache are shared by all replicas through Valkey.
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      VERIFY_CACHE_TTL: ${AUTH_BRIDGE_CACHE_TTL:-60}
      RATE_LIMIT_PER_MINUTE: ${AUTH_BRIDGE_RATE_LIMIT_PER_MINUTE:-1500}
      RATE_LIMIT_PER_USER_PER_MINUTE: ${AUTH_BRIDGE_RATE_LIMIT_PER_USER_PER_MINUTE:-10}
      BREAKER_FAILURE_THRESHOLD: ${AUTH_BRIDGE_BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_COOLDOWN: ${AUTH_BRIDGE_BREAKER_COOLDOWN:-30}
      # OLT-signed social tokens, verified with the OLT public key (docs/olt-integration.md).
      OLT_MODE: ${AUTH_BRIDGE_OLT_MODE:-jwt}
      OLT_JWT_JWKS_FILE: /run/secrets/olt_jwks
      OLT_JWT_ISSUER: ${OLT_JWT_ISSUER:-olt}
      OLT_JWT_AUDIENCE: ${OLT_JWT_AUDIENCE:-olt-social}
      OLT_JWT_MAX_TTL: ${OLT_JWT_MAX_TTL:-900}
    healthcheck:
      # The distroless image has no shell or curl; the binary provides a healthcheck subcommand.
      test: ["CMD", "/auth-bridge", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 64}

  # Mobile push notifications (services/notifier, docs/push/README.md). Pulls the push queue from
  # Postgres through PostgREST (service_role-only RPC) and sends it via Firebase Cloud Messaging.
  # The Firebase key is uploaded by a Super Admin in the web CS (Pengaturan → Push notification),
  # stored encrypted in Vault, and loaded without a restart. Without a key notifier stays "not
  # installed" and notifications still reach the in-app inbox. Only egress: Google (FCM + OAuth).
  notifier:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/notifier
    image: olt-social/notifier:0.2.0
    networks: [app, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      LOG_LEVEL: ${NOTIFIER_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      ANDROID_CHANNEL_ID: ${NOTIFIER_ANDROID_CHANNEL_ID:-}
      BATCH_SIZE: ${NOTIFIER_BATCH_SIZE:-100}
      CONCURRENCY: ${NOTIFIER_CONCURRENCY:-20}
    healthcheck:
      test: ["CMD", "/notifier", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 64}

  # Storage file cleaner (services/janitor). Drains private.storage_cleanup_queue (files of deleted
  # accounts: avatars, post/chat attachments, CS documents; and letters past retention) through the
  # Storage API so files on disk/S3 are removed too. Reported/removed content is first copied to the
  # evidence bucket (evidence quarantine, migration 0095).
  janitor:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/janitor
    image: olt-social/janitor:0.2.0
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
    stop_grace_period: 40s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      LOG_LEVEL: ${JANITOR_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      STORAGE_URL: http://storage:5000
    healthcheck:
      test: ["CMD", "/janitor", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 64}

  # NSFW image classifier (services/classifier, MODEL.md): Apache-2.0 MobileNetV4 on ONNX Runtime
  # (CPU). media calls it for every customer image before storing it; when it is down, image
  # uploads are rejected (fail closed). Compliance sets the threshold from the web CS.
  classifier:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/classifier
    image: olt-social/classifier:0.1.1
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      OPS_PORT: 9100
      LOG_LEVEL: ${CLASSIFIER_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      MAX_CONCURRENT: ${CLASSIFIER_MAX_CONCURRENT:-2}
    healthcheck:
      test: ["CMD", "/classifier", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M, pids: 64}

  # Virus scanner for CS chat documents and videos (ClamAV clamd + freshclam, GPL-2.0, official image).
  # media streams every file to clamd with INSTREAM on the app network before storing it; when clamd is
  # down those uploads are refused (fail closed) and Kesehatan sistem shows it (media heartbeat and the
  # sentinel probe). Signatures live in the clamav-db volume: the first start downloads ~300 MB from
  # database.clamav.net (egress, outbound HTTPS only, no published port), then freshclam checks
  # CLAMAV_FRESHCLAM_CHECKS times a day. clamd keeps the signatures in RAM (~1.1 GB in Nov 2026, growing);
  # ConcurrentDatabaseReload is off so a reload does not double that.
  clamav:
    <<: *base
    labels: ["olt.autoheal=true"]
    image: clamav/clamav:1.5.4_base@sha256:64ca916618842ba469ef38a501e6c2f42a68281c064c03749b0126c0fb085ce5
    user: "100:101"
    networks: [app, egress]
    stop_grace_period: 30s
    configs:
      - source: clamav-clamd
        target: /etc/clamav/clamd.conf
      - source: clamav-freshclam
        target: /etc/clamav/freshclam.conf
    volumes:
      - clamav-db:/var/lib/clamav
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=1m,mode=1777
    environment:
      FRESHCLAM_CHECKS: ${CLAMAV_FRESHCLAM_CHECKS:-4}
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
    deploy:
      resources:
        limits: {cpus: "1", memory: "${CLAMAV_MEMORY:-2G}", pids: 64}

  # Customer upload gateway (services/media): checks content by magic bytes, strips metadata
  # (EXIF/GPS, XMP, IPTC) without re-encoding, checks PDFs, then forwards to Storage with the
  # media_verified claim (required for customer uploads since migration 0063). CS chat documents
  # (PDF, Office without macros, TXT/CSV) and videos (MP4/MOV/WebM, remuxed without metadata, with a
  # thumbnail) follow the attachment policy set from the Hub and are scanned by clamav first. Kong
  # routes /media/v1/* to media:8080; the ops port 9100 (/livez, /readyz, /metrics) is not routed.
  media:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/media
    image: olt-social/media:0.3.0
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      classifier:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      OPS_PORT: 9100
      LOG_LEVEL: ${MEDIA_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      STORAGE_URL: http://storage:5000
      POSTGREST_URL: http://rest:3000
      MAX_CONCURRENT: ${MEDIA_MAX_CONCURRENT:-8}
      CLASSIFIER_URL: http://classifier:8080
      CLASSIFIER_TIMEOUT: ${MEDIA_CLASSIFIER_TIMEOUT:-10s}
      MODERATION_REFRESH: 30s
      MODEL_MISSING_POLICY: ${MEDIA_MODEL_MISSING_POLICY:-reject}
      REQUEST_TIMEOUT: ${MEDIA_REQUEST_TIMEOUT:-50s}
      CLAMD_ADDR: clamav:3310
      SCAN_TIMEOUT: ${MEDIA_SCAN_TIMEOUT:-40s}
      ATTACHMENT_REFRESH: 30s
      VIDEO_CONCURRENT: ${MEDIA_VIDEO_CONCURRENT:-2}
    # Temporary video files for ffprobe/ffmpeg (counted in the memory limit).
    tmpfs:
      - /tmp:size=192m,mode=1777
    healthcheck:
      test: ["CMD", "/media", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "1", memory: 768M, pids: 128}

  # PostgreSQL (PITR) and Storage file backups to a restic repository (services/backup, docs/backup):
  # pg_receivewal on slot olt_backup, a daily pg_basebackup, and a weekly restore test. Destination
  # (S3 or local folder BACKUP_LOCAL_REPO_DIR), encryption password, and schedule are set by a Super
  # Admin in the web CS (Pengaturan -> Backup). Replication connects directly, not through PgBouncer.
  backup:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/backup
    image: olt-social/backup:0.2.0
    # Fixed hostname so restic recognizes its own stale locks after a restart.
    hostname: backup
    networks: [data, app, egress]
    # Reads storage files owned by 1000:1000 even though their mode is 0640.
    group_add: ["1000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    stop_grace_period: 90s
    secrets: [jwt_secret, backup_db_password]
    environment:
      PORT: 8080
      LOG_LEVEL: ${BACKUP_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      PGHOST: ${POSTGRES_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: olt_backup
      PGPASSWORD_FILE: /run/secrets/backup_db_password
      DATA_DIR: /var/lib/olt-backup
      STORAGE_DIR: /mnt/storage
      LOCAL_REPO_DIR: /var/lib/olt-backup-repo
    volumes:
      - backup-data:/var/lib/olt-backup
      - storage-data:/mnt/storage:ro
      # restic repository for the "Folder lokal di server" destination; used only when that destination is chosen.
      - ${BACKUP_LOCAL_REPO_DIR:-../backups/restic}:/var/lib/olt-backup-repo
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1", memory: "${BACKUP_MEMORY:-1G}", pids: 256}

  # OLT integration gateway (services/integration, docs/integration): notifEngine sends transaction
  # notifications per cust_id (mapped from the social token `accounts` claim) and official bots post
  # news, using API keys created by a Super Admin in the web CS. Kong routes /integration/v1/* to
  # :8080; the ops port 9100 is not routed.
  integration:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/integration
    image: olt-social/integration:0.2.0
    networks: [app]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      OPS_PORT: 9100
      LOG_LEVEL: ${INTEGRATION_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      MAX_BODY_BYTES: ${INTEGRATION_MAX_BODY_BYTES:-2097152}
      MAX_CONCURRENT: ${INTEGRATION_MAX_CONCURRENT:-8}
    healthcheck:
      test: ["CMD", "/integration", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 64}

  # Link previews (services/link-preview): the only service that contacts arbitrary internet hosts.
  # SSRF protection rejects private addresses (Docker networks included), ports other than 80/443,
  # and more than 3 redirects. Every preview image goes through the classifier with the same
  # threshold as media; when the classifier is down, previews show no image (fail closed). Clients
  # read results through the get_link_previews RPC.
  link-preview:
    <<: *base
    labels: ["olt.autoheal=true"]
    build:
      context: ../services/link-preview
    image: olt-social/link-preview:0.2.0
    networks: [app, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      classifier:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret]
    environment:
      PORT: 8080
      LOG_LEVEL: ${LINK_PREVIEW_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      STORAGE_URL: http://storage:5000
      USER_AGENT: ${LINK_PREVIEW_USER_AGENT:-OLTSocialLinkPreview/1.0 (+https://olt-social.invalid/link-preview)}
      CONCURRENCY: ${LINK_PREVIEW_CONCURRENCY:-4}
      CLASSIFIER_URL: http://classifier:8080
      CLASSIFIER_TIMEOUT: ${LINK_PREVIEW_CLASSIFIER_TIMEOUT:-10s}
      MODERATION_REFRESH: 30s
    healthcheck:
      test: ["CMD", "/link-preview", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 128M, pids: 64}

  # System monitor (services/sentinel): every 30 s it probes internal services over HTTP/TCP and
  # reports disk usage to the database (alert rules are evaluated in the DB, docs/system-health),
  # then sends alerts to the Telegram/email channels a Super Admin sets in the web CS. The CS
  # profile overlays add the web CS and customer gateway probes through PROBES_EXTRA.
  sentinel:
    <<: *base
    build:
      context: ../services/sentinel
    image: olt-social/sentinel:0.4.0
    networks: [app, data, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    stop_grace_period: 30s
    secrets: [jwt_secret, pgbouncer_stats_password]
    volumes:
      - db-data:/mnt/disks/db:ro
      - storage-data:/mnt/disks/storage:ro
      - backup-data:/mnt/disks/backup:ro
      - ${BACKUP_LOCAL_REPO_DIR:-../backups/restic}:/mnt/disks/backup-repo:ro
      - healer-state:/mnt/healer:ro
    environment:
      PORT: 8080
      LOG_LEVEL: ${SENTINEL_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      PROBES: ${SENTINEL_PROBES:-storage=http://storage:5000/status,auth=http://auth:9999/health,rest=http://rest:3000/,realtime=http://realtime:4000/healthcheck,functions=http://functions:9000/,imgproxy=http://imgproxy:5001/health,kong=http://kong:8000/,auth-bridge=http://auth-bridge:9100/livez,notifier=http://notifier:8080/healthz,janitor=http://janitor:8080/healthz,media=http://media:9100/livez,backup=http://backup:8080/livez,integration=http://integration:9100/livez,link-preview=http://link-preview:8080/livez,classifier=http://classifier:9100/readyz,clamav=tcp://clamav:3310,db=tcp://db:5432,pgbouncer=tcp://pgbouncer:6432,valkey=tcp://valkey:6379}
      DISKS: db=/mnt/disks/db,storage=/mnt/disks/storage,backup=/mnt/disks/backup,backup-repo=/mnt/disks/backup-repo
      # Metrics for the PostgREST pool, Realtime event rate (JWT from jwt_secret = METRICS_JWT_SECRET),
      # and PgBouncer queue (SHOW POOLS as olt_stats) alerts. See services/sentinel/README.md.
      METRICS_SOURCES: ${SENTINEL_METRICS_SOURCES:-rest=http://rest:3001/metrics,realtime=jwt+http://realtime:4000/metrics,pgbouncer=pgbouncer://olt_stats@pgbouncer:6432}
      PGBOUNCER_STATS_PASSWORD_FILE: /run/secrets/pgbouncer_stats_password
      # Healer state feeds the health report (healer:* alerts). Empty disables it (cluster profile).
      HEALER_STATE_FILE: /mnt/healer/state.json
    healthcheck:
      test: ["CMD", "/sentinel", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 64}

  # Auto-restart (services/healer): restarts this project's containers labeled olt.autoheal=true
  # that have been unhealthy for >= HEALER_UNHEALTHY_SECONDS and up for >= HEALER_MIN_UPTIME_SECONDS,
  # at most HEALER_MAX_RESTARTS_PER_HOUR per service before giving up (alert healer:gave_up:<service>).
  # Holds off while db/pgbouncer is unhealthy or many services are unhealthy at once. The only
  # container with the Docker socket: no network at all, no ports, read-only rootfs.
  # dev/single only; in the cluster Swarm already replaces unhealthy tasks (replicas 0).
  healer:
    <<: *base
    build:
      context: ../services/healer
    image: olt-social/healer:0.1.0
    network_mode: none
    user: "65532:65532"
    # Group owning /var/run/docker.sock: 0 on Docker Desktop, the `docker` group on Linux
    # (getent group docker | cut -d: -f3), set through HEALER_DOCKER_GID.
    group_add: ["${HEALER_DOCKER_GID:-0}"]
    stop_grace_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - healer-state:/var/lib/olt-healer
    environment:
      LOG_LEVEL: ${HEALER_LOG_LEVEL:-info}
      HEALER_ENABLED: ${HEALER_ENABLED:-true}
      HEALER_PROJECT: ${HEALER_PROJECT:-}
      HEALER_INTERVAL_SECONDS: ${HEALER_INTERVAL_SECONDS:-10}
      HEALER_UNHEALTHY_SECONDS: ${HEALER_UNHEALTHY_SECONDS:-60}
      HEALER_MIN_UPTIME_SECONDS: ${HEALER_MIN_UPTIME_SECONDS:-120}
      HEALER_MAX_RESTARTS_PER_HOUR: ${HEALER_MAX_RESTARTS_PER_HOUR:-3}
      HEALER_GLOBAL_COOLDOWN_SECONDS: ${HEALER_GLOBAL_COOLDOWN_SECONDS:-30}
      HEALER_SYSTEMIC_FRACTION: ${HEALER_SYSTEMIC_FRACTION:-0.5}
      HEALER_STATE_FILE: /var/lib/olt-healer/state.json
    healthcheck:
      # No network: healthy when the state file was updated within the last 3 intervals.
      test: ["CMD", "/healer", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: {cpus: "0.1", memory: 32M, pids: 32}

  # Compose profile `cs` (docs/cs-chat): always on in dev; production enables it with
  # CS=1 (Windows: -Cs).

  # Rendezvous Hub (web CS, github.com/dayat123123/rendezvous_hub): static SPA on non-root nginx,
  # built from the checkout next to this repo (HUB_DIR, relative to docker/). Agent browsers call
  # the API through SUPABASE_URL; env.js is written at container start. Production is reachable
  # only over the VPN (compose.cs.yml + volumes/traefik/cs.yml).
  cs-console:
    <<: *base
    labels: ["olt.autoheal=true"]
    profiles: [cs]
    build:
      context: ${HUB_DIR:-../../rendezvous_hub}
    image: olt-social/cs-console:0.1.1
    user: "101:101"
    networks: [edge]
    stop_grace_period: 10s
    tmpfs:
      - /tmp:size=16m,mode=1777
    secrets: [anon_key]
    environment:
      SUPABASE_URL: ${CS_CONSOLE_API_URL:-http://localhost:8000}
      PUBLIC_API_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY_FILE: /run/secrets/anon_key
      APP_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 64}

  # Customer Account menu gateway for the web CS (services/nasabah-gateway, docs/nasabah/README.md).
  # Forwards only staff /online/* routes to csAdmin with an integration token: the gateway signs an
  # Ed25519 assertion (docker/secrets/csadmin_signing_key) and csAdmin verifies it with the public key
  # in its integration config block. Address and client id are set by a Super Admin in the web CS
  # (Pengaturan -> Integrasi API Nasabah); until they are saved after a successful connection test,
  # the gateway answers 503 not_configured. Checks per-account CS permissions and logs actions to cs_audit_log.
  nasabah-gateway:
    <<: *base
    labels: ["olt.autoheal=true"]
    profiles: [cs]
    build:
      context: ../services/nasabah-gateway
    image: olt-social/nasabah-gateway:0.1.0
    # edge: from Traefik; app: PostgREST; egress: the csAdmin server on the local network.
    networks: [edge, app, egress]
    depends_on:
      rest:
        condition: service_healthy
    stop_grace_period: 10s
    secrets: [jwt_secret, csadmin_signing_key]
    environment:
      PORT: 8080
      LOG_LEVEL: ${NASABAH_GATEWAY_LOG_LEVEL:-info}
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      POSTGREST_URL: http://rest:3000
      CSADMIN_SIGNING_KEY_FILE: /run/secrets/csadmin_signing_key
      CSADMIN_TIMEOUT: ${CSADMIN_TIMEOUT:-15s}
    healthcheck:
      test: ["CMD", "/nasabah-gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M, pids: 64}

  # Ops service (not started by `up`), used by Makefile/make.ps1:
  #   docker compose run --rm tools migrate|seed|test-db|smoke|backup|restore|psql
  # Scripts run in a Linux container, so Windows hosts need no bash/psql.
  tools:
    <<: *base
    restart: "no"
    image: olt-social/tools:0.1.0
    profiles: [tools]
    user: "1000:1000"
    networks: [app, data]
    tmpfs:
      - /tmp:size=256m,mode=1777
    configs:
      - source: with-secrets
        target: /opt/olt/with-secrets.sh
    # jwt_secret: smoke-cs, dev staff accounts, and the super admin bootstrap sign JWTs like GoTrue.
    secrets: [postgres_password, anon_key, jwt_secret]
    entrypoint: ["/bin/sh", "/opt/olt/with-secrets.sh", "bash", "/olt/scripts/tools.sh"]
    volumes:
      - ../scripts:/olt/scripts:ro
      - ../supabase:/olt/supabase:ro
      - ../backups:/olt/backups
    environment:
      HOME: /tmp
      PGHOST: ${POSTGRES_HOST:-db}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: "{{secret:postgres_password}}"
      SUPABASE_URL: http://kong:8000
      ANON_KEY: "{{secret:anon_key}}"
      JWT_SECRET: "{{secret:jwt_secret}}"

networks:
  edge:
    internal: true
    ipam:
      config:
        # Fixed subnet: Kong trusts X-Forwarded-For only from here (Traefik).
        - subnet: ${EDGE_SUBNET:-10.250.250.0/24}
  app:
    internal: true
  data:
    internal: true
  egress: {}

volumes:
  db-data:
  db-config:
  storage-data:
  backup-data:
  healer-state:
  clamav-db:
  deno-cache:
  traefik-acme:

configs:
  with-secrets:
    file: ./volumes/olt/with-secrets.sh
  traefik-common:
    file: ./volumes/traefik/common.yml
  kong-config:
    file: ./volumes/api/kong.yml
  kong-entrypoint:
    file: ./volumes/api/kong-entrypoint.sh
  db-realtime:
    file: ./volumes/db/realtime.sql
  db-webhooks:
    file: ./volumes/db/webhooks.sql
  db-roles:
    file: ./volumes/db/roles.sql
  db-jwt:
    file: ./volumes/db/jwt.sql
  db-hba:
    file: ./volumes/db/pg_hba.conf
  rest-pg-service:
    file: ./volumes/rest/pg_service.conf
  clamav-clamd:
    file: ./volumes/clamav/clamd.conf
  clamav-freshclam:
    file: ./volumes/clamav/freshclam.conf

# Created by `make gen-secrets`; docker/secrets/ is never committed.
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  backup_db_password:
    file: ./secrets/backup_db_password
  jwt_secret:
    file: ./secrets/jwt_secret
  anon_key:
    file: ./secrets/anon_key
  service_role_key:
    file: ./secrets/service_role_key
  dashboard_password:
    file: ./secrets/dashboard_password
  secret_key_base:
    file: ./secrets/secret_key_base
  realtime_db_enc_key:
    file: ./secrets/realtime_db_enc_key
  realtime_erlang_cookie:
    file: ./secrets/realtime_erlang_cookie
  pg_meta_crypto_key:
    file: ./secrets/pg_meta_crypto_key
  s3_protocol_access_key_id:
    file: ./secrets/s3_protocol_access_key_id
  s3_protocol_access_key_secret:
    file: ./secrets/s3_protocol_access_key_secret
  valkey_password:
    file: ./secrets/valkey_password
  postgrest_db_uri:
    file: ./secrets/postgrest_db_uri
  pgbouncer_stats_password:
    file: ./secrets/pgbouncer_stats_password
  olt_jwks:
    file: ./secrets/olt_jwks
  csadmin_signing_key:
    file: ./secrets/csadmin_signing_key
