# OPT-IN, hanya untuk mengukur kapasitas di stack DEV (docs/testing/README.md). JANGAN dipakai di produksi
# dan jangan ditambahkan ke Makefile/make.ps1 target up. Menaikkan batas event/detik tenant Realtime agar
# uji beban mengukur batas perangkat keras, bukan batas konfigurasi. Realtime men-seed ulang tenant dari env
# ini setiap start (SEED_SELF_HOST), jadi mengubah _realtime.tenants langsung tidak bertahan.
#
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml -f docker/compose.dummy-olt.yml \
#     -f docker/compose.loadtest.yml --profile cs up -d --no-deps realtime
#   ... uji beban ...
#   docker compose -f docker/compose.yml -f docker/compose.dev.yml -f docker/compose.dummy-olt.yml \
#     --profile cs up -d --no-deps realtime          (kembali ke batas bawaan)

services:
  realtime:
    environment:
      TENANT_MAX_EVENTS_PER_SECOND: ${LOADTEST_REALTIME_MAX_EVENTS_PER_SECOND:-20000}
