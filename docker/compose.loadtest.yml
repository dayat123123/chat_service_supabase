# Opt-in, dev stack capacity tests only (docs/testing/README.md). Never use it in production and
# never add it to the Makefile/make.ps1 up targets. Raises the Realtime tenant event rate so load
# tests measure hardware limits, not configuration limits. Realtime re-seeds the tenant from this
# env on every start (SEED_SELF_HOST), so editing _realtime.tenants directly does not persist.

services:
  realtime:
    environment:
      TENANT_MAX_EVENTS_PER_SECOND: ${LOADTEST_REALTIME_MAX_EVENTS_PER_SECOND:-20000}
