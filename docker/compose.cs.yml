# Web CS and agent API are served on one CS_CONSOLE_DOMAIN that only accepts IPs from
# VPN_SOURCE_RANGES (Traefik ipAllowList). Single origin, so no CORS. See docs/PRODUCTION.md.

services:
  traefik:
    configs:
      - source: traefik-routes-cs
        target: /etc/traefik/dynamic/cs.yml
    environment:
      CS_CONSOLE_DOMAIN: ${CS_CONSOLE_DOMAIN:?CS_CONSOLE_DOMAIN is required when CS=1 (docker/.env)}
      VPN_SOURCE_RANGES: ${VPN_SOURCE_RANGES:?VPN_SOURCE_RANGES is required when CS=1 (docker/.env)}

  cs-console:
    environment:
      SUPABASE_URL: https://${CS_CONSOLE_DOMAIN:?CS_CONSOLE_DOMAIN is required when CS=1 (docker/.env)}

  sentinel:
    networks: [app, data, edge, egress]
    environment:
      PROBES_EXTRA: cs-console=http://cs-console:8080/healthz,nasabah-gateway=http://nasabah-gateway:8080/healthz

configs:
  traefik-routes-cs:
    file: ./volumes/traefik/cs.yml
