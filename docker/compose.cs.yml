# Web CS and agent API are served on one CS_CONSOLE_DOMAIN (public domain, internal domain, or IP).
# VPN_SOURCE_RANGES (Traefik ipAllowList) is optional: empty limits the domain to private networks
# (office LAN and VPN). CS_CONSOLE_SCHEME=https (default, Let's Encrypt) or http (office-only, no TLS).
# Single origin, so no CORS. See docs/panduan/produksi.md.

services:
  traefik:
    configs:
      - source: traefik-routes-cs
        target: /etc/traefik/dynamic/cs.yml
    environment:
      CS_CONSOLE_DOMAIN: ${CS_CONSOLE_DOMAIN:?CS_CONSOLE_DOMAIN is required when CS=1 (docker/.env)}
      VPN_SOURCE_RANGES: ${VPN_SOURCE_RANGES:-}
      CS_CONSOLE_SCHEME: ${CS_CONSOLE_SCHEME:-https}

  cs-console:
    environment:
      SUPABASE_URL: ${CS_CONSOLE_SCHEME:-https}://${CS_CONSOLE_DOMAIN:?CS_CONSOLE_DOMAIN is required when CS=1 (docker/.env)}

  sentinel:
    networks: [app, data, edge, egress]
    environment:
      PROBES_EXTRA: cs-console=http://cs-console:8080/healthz,nasabah-gateway=http://nasabah-gateway:8080/healthz

configs:
  traefik-routes-cs:
    file: ./volumes/traefik/cs.yml
