# Override produksi (VPS): HTTPS otomatis via Caddy + Let's Encrypt.
#
#   make up PROD=1
#
# - Internet hanya bisa menjangkau path API lewat Caddy (80/443).
# - Kong hanya di-bind ke 127.0.0.1 sehingga Studio bisa dibuka lewat SSH tunnel:
#     ssh -L 8000:127.0.0.1:8000 user@vps   lalu buka http://localhost:8000
# - Kong mempercayai X-Forwarded-For dari Caddy agar auth-bridge melihat IP
#   klien asli (rate limit per IP tetap akurat).

services:
  kong:
    ports: !override
      - 127.0.0.1:${KONG_HTTP_PORT:-8000}:8000/tcp
    environment:
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"

  auth-bridge:
    environment:
      APP_ENV: production

  caddy:
    container_name: olt-caddy
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks: [public]
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN:?PROXY_DOMAIN wajib diisi untuk mode produksi}
    volumes:
      - ./volumes/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
